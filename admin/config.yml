backend:
  name: github
  repo: Veeresh36/neharuVicharVedike
  branch: main
  base_url: https://api.netlify.com
  auth_endpoint: auth

media_folder: ""
public_folder: "/"

collections:
  - name: "site_info"
    label: "Site Info"
    files:
      - file: "site-info.json"
        label: "Contact & Basic Info"
        name: "site_info"
        fields:
          - { label: "Phone", name: "phone", widget: "string" }
          - { label: "Email", name: "email", widget: "string" }
          - { label: "Address", name: "address", widget: "string" }